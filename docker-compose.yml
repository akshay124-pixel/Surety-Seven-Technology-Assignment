version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: suretyseven-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: suretyseven
    ports:
      - "5433:5432"  # Changed external port to avoid conflict
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - suretyseven-network

  redis:
    image: redis:7-alpine
    container_name: suretyseven-redis
    ports:
      - "6380:6379"  # Changed external port to avoid conflict
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - suretyseven-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: suretyseven-app
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/suretyseven?schema=public
      REDIS_URL: redis://redis:6379
      APPLICANT_API_URL: http://app:3000/external/applicants
      APPLICANT_API_TIMEOUT_MS: 5000
      APPLICANT_API_MAX_RETRIES: 3
      DOWNSTREAM_API_URL: http://app:3000/external/downstream/events
      DOWNSTREAM_API_TIMEOUT_MS: 5000
      DOWNSTREAM_API_MAX_RETRIES: 5
      QUEUE_EVALUATION_CONCURRENCY: 5
      QUEUE_NOTIFICATION_CONCURRENCY: 3
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX_REQUESTS: 100
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        npx prisma migrate deploy &&
        node dist/server.js
      "
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); })"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    networks:
      - suretyseven-network
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: suretyseven-worker
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/suretyseven?schema=public
      REDIS_URL: redis://redis:6379
      APPLICANT_API_URL: http://app:3000/external/applicants
      APPLICANT_API_TIMEOUT_MS: 5000
      APPLICANT_API_MAX_RETRIES: 3
      DOWNSTREAM_API_URL: http://app:3000/external/downstream/events
      DOWNSTREAM_API_TIMEOUT_MS: 5000
      DOWNSTREAM_API_MAX_RETRIES: 5
      QUEUE_EVALUATION_CONCURRENCY: 5
      QUEUE_NOTIFICATION_CONCURRENCY: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    command: >
      sh -c "
        npx prisma generate &&
        node dist/workers/index.js
      "
    networks:
      - suretyseven-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  suretyseven-network:
    driver: bridge
